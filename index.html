<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Exodus</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; script-src-elem 'self' https://*.googleapis.com https://*.tradingview.com; font-src 'self' data: https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://*.googleapis.com; img-src * data: ;connect-src 'self' http://localhost:60223/ https://*.googleapis.com; media-src 'self' blob:; frame-src 'self' exodus-artifact: https://*.codesandbox.io https://*.tradingview.com https://*.tradingview-widget.com https://embed.diagrams.net https://app.diagrams.net https://viewer.diagrams.net;"
    />
    <style>
      /*
        Cold-boot splash: pure CSS/HTML, no JS dependency, so it paints
        before the module graph (React included) has loaded. Lives inside
        #root so React's first `createRoot(...).render(...)` commit clears
        it automatically — no explicit teardown code needed. No background
        of its own — the window is `transparent: true` with macOS
        `vibrancy: 'sidebar'` (see main/lib/window.ts) and globals.css keeps
        `body` at `bg-transparent` for that reason; painting an opaque
        background here would blank out the vibrancy effect during boot.
        The splash itself (Ody peeking in, blinking, three loading dots) is
        generated between the boot-splash markers by `bun run icons` from
        brand/peekaboo.mjs — edit it there, not here. It animates only
        transform/opacity, which run on the compositor, so it keeps moving
        while the main thread evaluates the module graph. Dot colors are
        hardcoded (not var(--foreground) etc.) because globals.css isn't
        guaranteed to have applied yet; keep in sync with the `:root`/`.dark`
        tokens in assets/stylesheets/globals.css. Only
        follows prefers-color-scheme (not the in-app theme override stored
        in localStorage) — a user who overrides their OS theme may see one
        mismatched frame here before ThemeProvider corrects it.
      */
      html,
      body {
        margin: 0;
      }
      /* boot-splash:start — generated by `bun run icons` (brand/peekaboo/art.mjs) */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      #boot-splash .bs-icon {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 22.4%;
        overflow: hidden;
        box-shadow:
          0 8px 24px rgb(0 0 0 / 16%),
          0 1px 2px rgb(0 0 0 / 12%);
        animation: bs-rise 500ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #boot-splash .bs-layer {
        position: absolute;
        inset: 0;
      }
      /* Ody runs past the layer's box; the icon's rounded clip trims it,
         so the layers must not clip on their own or the bob shows an edge. */
      #boot-splash svg {
        display: block;
        overflow: visible;
      }
      /* Ody leans in from the corner, then keeps breathing. */
      #boot-splash .bs-enter {
        animation: bs-peek 700ms 120ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #boot-splash .bs-bob {
        transform-origin: 80% 100%;
        animation: bs-bob 2400ms 820ms cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      #boot-splash .bs-eyes {
        transform-origin: 51% 74%;
        animation: bs-blink 3600ms 1400ms infinite;
      }
      #boot-splash .bs-line {
        transform-origin: 26% 30%;
        animation: bs-spot 1800ms cubic-bezier(0.23, 1, 0.32, 1) infinite both;
      }
      #boot-splash .bs-line-1 {
        animation-delay: 700ms;
      }
      #boot-splash .bs-line-2 {
        animation-delay: 780ms;
      }
      #boot-splash .bs-line-3 {
        animation-delay: 860ms;
      }
      #boot-splash .bs-dots {
        display: flex;
        gap: 6px;
      }
      #boot-splash .bs-dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: oklch(0.556 0 0);
        animation: bs-dot 1200ms cubic-bezier(0.77, 0, 0.175, 1) infinite both;
      }
      #boot-splash .bs-dots i:nth-child(2) {
        animation-delay: 150ms;
      }
      #boot-splash .bs-dots i:nth-child(3) {
        animation-delay: 300ms;
      }
      @keyframes bs-rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
      }
      @keyframes bs-peek {
        from {
          transform: translate(22%, 22%) rotate(8deg);
        }
      }
      @keyframes bs-bob {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: translate(-2.5%, -3%) rotate(-2.5deg);
        }
      }
      @keyframes bs-blink {
        0%,
        92%,
        100% {
          transform: none;
        }
        95% {
          transform: scaleY(0.12);
        }
      }
      @keyframes bs-spot {
        0% {
          opacity: 0;
          transform: scale(0.6);
        }
        25%,
        70% {
          opacity: 1;
          transform: none;
        }
        100% {
          opacity: 0;
          transform: none;
        }
      }
      @keyframes bs-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: none;
        }
        40% {
          opacity: 0.9;
          transform: translateY(-3px);
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash .bs-dots i {
          background: oklch(0.708 0 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-icon,
        #boot-splash .bs-enter,
        #boot-splash .bs-bob,
        #boot-splash .bs-line {
          animation: none;
        }
        #boot-splash .bs-dots i {
          transform: none;
        }
      }
      /* boot-splash:end */
    </style>
  </head>

  <body>
    <div id="root">
      <!-- boot-splash:start -->
      <div id="boot-splash" aria-hidden="true">
        <div class="bs-icon">
          <div class="bs-layer">
            <svg viewBox="0 0 1024 1024" width="100%" height="100%">
              <defs>

                  <feGaussianBlur stdDeviation="4" />

                <filter id="bsbb8" x="-60%" y="-60%" width="220%" height="220%">

                </filter>
                <filter
                  id="bsbb14"
                  x="-60%"
                  y="-60%"
                  width="220%"
                  height="220%"
                >
                  <feGaussianBlur stdDeviation="14" />
                </filter>
                <filter
                  id="bsbb24"
                  x="-60%"
                  y="-60%"
                  width="220%"
                  height="220%"
                >
                  <feGaussianBlur stdDeviation="24" />
                </filter>
                <filter
                  id="bsbb44"

                  height="220%"

                </filter>

                  <stop offset="0" stop-color="#9AF3D6" stop-opacity="1" />
                  <stop offset="1" stop-color="#22B088" stop-opacity="1" />
                </linearGradient>
              </defs>
              <rect width="1024" height="1024" fill="url(#bsbbg)" />
              <ellipse
                cx="512"
                cy="110"
                rx="560"
                ry="290"
                fill="#fff"
                opacity="0.26"
                filter="url(#bsbb44)"
              />
            </svg>
          </div>
          <div class="bs-layer bs-line bs-line-1">
            <svg viewBox="0 0 1024 1024" width="100%" height="100%">
              <g
                fill="none"
                stroke="#fff"
                stroke-width="16"
                stroke-linecap="round"
                opacity=".85"
              >
                <path d="M236 236l-18-58" />
              </g>
            </svg>
          </div>
          <div class="bs-layer bs-line bs-line-2">
            <svg viewBox="0 0 1024 1024" width="100%" height="100%">
              <g
                fill="none"
                stroke="#fff"
                stroke-width="16"
                stroke-linecap="round"

            </svg>
          </div>
          <div class="bs-layer bs-line bs-line-3">
            <svg viewBox="0 0 1024 1024" width="100%" height="100%">
              <g
                fill="none"
                stroke="#fff"
                stroke-width="16"
                stroke-linecap="round"
                opacity=".85"
              >
                <path d="M150 400h-60" />
              </g>
            </svg>
          </div>
          <div class="bs-layer bs-enter">
            <div class="bs-layer bs-bob">
              <div class="bs-layer">
                <svg viewBox="0 0 1024 1024" width="100%" height="100%">
                  <defs>
                    <filter
                      id="bsob4"
                      x="-60%"
                      y="-60%"
                      width="220%"
                      height="220%"
                    >
                      <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter
                      id="bsob8"
                      x="-60%"
                      y="-60%"
                      width="220%"
                      height="220%"
                    >
                      <feGaussianBlur stdDeviation="8" />
                    </filter>
                    <filter
                      id="bsob14"
                      x="-60%"
                      y="-60%"
                      width="220%"
                      height="220%"
                    >
                      <feGaussianBlur stdDeviation="14" />
                    </filter>
                    <filter
                      id="bsob24"
                      x="-60%"
                      y="-60%"
                      width="220%"
                      height="220%"
                    >
                      <feGaussianBlur stdDeviation="24" />
                    </filter>
                    <filter
                      id="bsob44"
                      x="-60%"
                      y="-60%"
                      width="220%"
                      height="220%"
                    >
                      <feGaussianBlur stdDeviation="44" />
                    </filter>
                    <radialGradient id="bsobody" cx="0.36" cy="0.26" r="0.85">
                      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1" />
                      <stop
                        offset="0.5"
                        stop-color="#F6F2EC"
                        stop-opacity="1"
                      />
                      <stop offset="1" stop-color="#D3C8B8" stop-opacity="1" />
                    </radialGradient>
                    <linearGradient id="bsorim" x1="0" y1="0" x2="0" y2="1">
                      <stop
                        offset="0.5"
                        stop-color="#7A5A2A"
                        stop-opacity="0"
                      />
                      <stop
                        offset="1"
                        stop-color="#7A5A2A"
                        stop-opacity="0.3"
                      />
                    </linearGradient>
                    <clipPath id="bsoclip">
                      <path
                        d="M512 210C712 210 830 420 830 610C830 800 700 930 512 930C324 930 194 800 194 610C194 420 312 210 512 210Z"
                      />
                    </clipPath>
                  </defs>
                  <ellipse
                    cx="700"
                    cy="1000"
                    rx="420"
                    ry="90"
                    fill="#0E6A50"
                    opacity=".35"
                    filter="url(#bsob44)"
                  />
                  <g
                    transform="translate(800 1080) rotate(-20) scale(1.22) translate(-512 -850)"
                  >
                    <path
                      d="M512 210C712 210 830 420 830 610C830 800 700 930 512 930C324 930 194 800 194 610C194 420 312 210 512 210Z"
                      fill="url(#bsobody)"
                    />
                    <path
                      d="M512 210C712 210 830 420 830 610C830 800 700 930 512 930C324 930 194 800 194 610C194 420 312 210 512 210Z"
                      fill="url(#bsorim)"
                      opacity=".6"
                    />
                    <g clip-path="url(#bsoclip)">
                      <path
                        d="M512 210C712 210 830 420 830 610C830 800 700 930 512 930C324 930 194 800 194 610C194 420 312 210 512 210Z"
                        fill="none"
                        stroke="#B9A88F"
                        stroke-width="160"
                        opacity=".32"
                        filter="url(#bsob44)"
                        transform="translate(-30 -20)"
                      />
                      <path
                        d="M512 210C712 210 830 420 830 610C830 800 700 930 512 930C324 930 194 800 194 610C194 420 312 210 512 210Z"
                        fill="none"
                        stroke="#fff"
                        stroke-width="30"
                        opacity=".45"
                        filter="url(#bsob14)"
                        transform="translate(14 10)"
                      />
                    </g>
                    <ellipse
                      cx="398"
                      cy="372"
                      rx="84"
                      ry="42"
                      transform="rotate(-38 398 372)"
                      fill="#fff"
                      filter="url(#bsob14)"
                    />

                    <g fill="#FF7E95" opacity=".5" filter="url(#bsob4)">
                      <ellipse cx="270" cy="638" rx="34" ry="16" />
                      <ellipse cx="494" cy="634" rx="32" ry="16" />
                    </g>
                    <ellipse cx="387" cy="622" rx="15" ry="19" fill="#1B1B1F" />
                  </g>
                </svg>
              </div>
              <div class="bs-layer bs-eyes">
                <svg viewBox="0 0 1024 1024" width="100%" height="100%">
                  <g
                    transform="translate(800 1080) rotate(-20) scale(1.22) translate(-512 -850)"
                  >
                    <g fill="#1B1B1F">
                      <ellipse cx="328" cy="522" rx="31" ry="60" />
                      <ellipse cx="446" cy="522" rx="31" ry="60" />
                    </g>
                    <g fill="#fff">
                      <circle cx="322" cy="494" r="10" />
                      <circle cx="440" cy="494" r="10" />
                    </g>
                  </g>
                </svg>
              </div>
            </div>
          </div>
        </div>
        <div class="bs-dots"><i></i><i></i><i></i></div>
      </div>
      <!-- boot-splash:end -->
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
