# electron-builder can't resolve deps inside pnpm's isolated (.pnpm) layout —
# a release build drops most of the transitive tree and the packaged app
# crashes at startup. A flat node_modules is the documented workaround.
# Run `pnpm install` after changing this.
nodeLinker: hoisted

allowBuilds:
  '@google/genai': true
  electron-winstaller: true
  esbuild: true
  msw: true
  protobufjs: true
