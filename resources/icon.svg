<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    App icon (dock / launcher) — same Path of Stars motif as the tray
    template, but rendered with the room a 512×512 canvas affords:
    rounded-square dark backdrop, a gradient-stroked path, three stars
    of growing size with a soft glow on the destination.
    Color story: deep midnight backdrop → indigo → cyan trail → warm
    near-white "destination" star, evoking arrival from a journey.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1024" />
      <stop offset="100%" stop-color="#181B3A" />
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#7CD9FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="starA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F5FAFF" stop-opacity="1" />
      <stop offset="60%" stop-color="#A9C4FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#5B6CFF" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="starB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#9BE3FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3CB7FF" stop-opacity="0.5" />
    </radialGradient>
    <radialGradient id="starC" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FFF1C0" stop-opacity="0.98" />
      <stop offset="80%" stop-color="#FFB770" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FF7A3D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE8B0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded-square backdrop (~22% radius keeps it on-brand with macOS Big Sur+ apps) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)" />

  <!-- Faint sub-grid hint: a few star specks for atmosphere -->
  <g fill="#FFFFFF" fill-opacity="0.18">
    <circle cx="80" cy="200" r="2" />
    <circle cx="150" cy="120" r="1.5" />
    <circle cx="430" cy="350" r="2" />
    <circle cx="380" cy="430" r="1.4" />
    <circle cx="60" cy="400" r="1.6" />
    <circle cx="240" cy="140" r="1.3" />
    <circle cx="330" cy="200" r="1.6" />
  </g>

  <!-- Halo behind the destination star -->
  <circle cx="380" cy="140" r="120" fill="url(#halo)" />

  <!-- Trajectory: gentle arc from bottom-left through middle to top-right -->
  <path
    d="M 100 400 Q 230 320 380 140"
    stroke="url(#trail)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Stars (small → medium → destination) -->
  <circle cx="100" cy="400" r="22" fill="url(#starA)" />
  <circle cx="230" cy="280" r="32" fill="url(#starB)" />
  <circle cx="380" cy="140" r="58" fill="url(#starC)" />
</svg>
